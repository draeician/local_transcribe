[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-transcribe"
version = "0.7.0"
description = "Local transcription with Whisper (YouTube and audio files)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]
dependencies = [
    # Core YT-DLP with 2026 SABR/Impersonation support
    "yt-dlp[curl-cffi,default]>=2025.1.1",
    # Needed for Chromium/Brave --cookies-from-browser + gnomekeyring
    "secretstorage>=3.3.0",
    "jeepney>=0.8",
    "cryptography>=42.0.0",
    # CPU-safe inference stack (CTranslate2; no PyTorch required)
    "faster-whisper>=1.0.3",
    "tqdm>=4.66.2",
    "soundfile>=0.12.1",
    "ctranslate2>=4.3.1",
    # faster-whisper decodes via PyAV and still passes av.open(metadata_errors=...);
    # PyAV 19 removed that kwarg, so a clean resolve would break real transcription.
    "av>=14,<19",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# CUDA 12 acceleration, added only when explicitly requested (see
# install_local_transcribe.py / `--cuda`). CTranslate2 4.x links cuDNN 9 and
# cuBLAS 12, so these are the matching NVIDIA wheels. Installing them on a
# CPU-only host is not required and is never done automatically.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
]

[project.scripts]
lt = "local_transcribe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
markers = [
    "nfs: real NFSv3 lab tests (require LT_NFS_QUEUE_DIR)",
]
